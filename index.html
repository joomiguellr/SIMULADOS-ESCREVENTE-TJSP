<style>
:root{--ink:#1b2a49;--bg:#f5f6f8;--line:#dfe3ea;--ok:#1f8a5b;--bad:#c0392b;--mut:#6b7385}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:70px}
main{max-width:720px;margin:auto;padding:16px}h1,h2,.big{font-family:Iowan Old Style,Palatino,Georgia,serif;font-weight:700}h1{margin:4px 0;font-size:34px}h2{font-size:24px}h3{font-size:17px}
.m,small.m{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.hero{text-align:center;padding:12px 0}.logo{width:340px;max-width:92%}.big{font-size:44px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}.gc{background:#e8f5ee;border-color:var(--ok)}.rc{background:#fbebe9;border-color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-block}button:focus-visible,.btn:focus-within,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.q{font-size:17px;margin:8px 0}
.alt{display:block;width:100%;text-align:left;margin:6px 0}.alt.sel{border-color:var(--ink);background:#e9edf5}.alt.g{background:#cfe9dc;border-color:var(--ok)}.alt.r{background:#f6d4d0;border-color:var(--bad)}.alt:disabled{color:inherit}
.ex{display:block;margin:2px 0 8px 6px;padding:4px 8px;border-left:3px solid var(--line);color:var(--mut)}div.ex.g{border-color:var(--ok)}div.ex.r{border-color:var(--bad)}
.grid{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}.grid button{width:36px;padding:4px 0}.grid .dn{background:#e9edf5}.grid .cur{border-color:var(--ink);font-weight:700}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.bar{height:8px;background:#e9edf5;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.ch{width:100%}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}nav button{border:0;padding:8px 9px;font-size:13px;background:none}nav .on{background:var(--ink);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}.dng{background:var(--bad);color:#fff;border-color:var(--bad)}.dz{border-color:var(--bad)}
.tx{background:#eef1f6;border-left:3px solid var(--ink);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:15px}
select,input{font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px}

<script>
const M={LP:'Língua Portuguesa',DP:'Direito Penal',DPP:'Processo Penal',DPC:'Processo Civil',DC:'Constitucional',DA:'Administrativo',LI:'Legislação Interna',AT:'Atualidades',MA:'Matemática',IN:'Informática',RL:'Raciocínio Lógico'};
const BL={LP:1,DP:2,DPP:2,DPC:2,DC:2,DA:2,LI:2,AT:3,MA:3,IN:3,RL:3};
// Formato 2025/edital 2026: LP16 DP4 DPP5 DPC5 DC5 DA6 LI5 AT4 MA4 IN9 RL7 = 70
const BANK={1:[{"m":"LP","t":"Com base no texto, conclui-se que, para o autor, o descanso","a":["deve ser evitado por quem pretende demonstrar dedicação.","é uma recompensa devida apenas a quem já cumpriu todas as obrigações.","faz parte do próprio trabalho, pois as pausas regulares favorecem a concentração e reduzem os erros.","equivale à preguiça, que o texto procura defender.","substitui o trabalho nos momentos em que a mente está cansada."],"c":2,"x":["O autor diz que ignorar o ritmo da mente pode parecer dedicação, mas costuma gerar cansaço e atrasos.","Essa é a visão que o autor apresenta no início para, em seguida, contestá-la (“Contudo...”).","O texto afirma que o descanso funciona “menos como prêmio do que como parte do próprio trabalho”.","O 2º parágrafo nega expressamente: “Não se trata de defender a preguiça”.","O texto não propõe substituir o trabalho, e sim incluir pausas regulares nele."],"g":0},{"m":"LP","t":"No trecho “a mente, assim como o corpo, rende melhor quando se respeita o seu ritmo”, a expressão “assim como” estabelece, entre os termos que une, relação de","a":["causa.","conclusão.","oposição.","condição.","comparação."],"c":4,"x":["Não indica o motivo de um fato.","Não encerra raciocínio anterior.","Não há contraste entre os termos; eles são equiparados.","A ideia de condição vem de “quando”, não de “assim como”.","Aproxima mente e corpo: ambos rendem melhor quando se respeita o ritmo."],"g":0},{"m":"LP","t":"No contexto em que aparecem, os termos “reservado” (1º parágrafo) e “rende” (2º parágrafo) significam, correta e respectivamente:","a":["oferecido; esquece.","exigido; paga.","proibido; fica cansado.","negado; desiste.","destinado; tem bom desempenho."],"c":4,"x":["Nenhum dos sentidos se ajusta ao contexto.","“Rende” não tem aqui o sentido de pagar.","“Reservado” não significa proibido, e “rende” não indica cansaço.","“Rende” indica produtividade, o oposto de desistir.","“Reservado” = destinado a alguém; “rende” = produz bem, tem bom desempenho."],"g":0},{"m":"LP","t":"Assinale a alternativa que atende à norma-padrão de concordância e de regência.","a":["Prefiro mais o descanso do que o excesso de trabalho.","Os estudos de que falei mostram que as pausas aumentam a concentração.","Houveram muitas reclamações sobre o excesso de tarefas.","Os funcionários assistiram o treinamento sobre descanso.","Fazem anos que se discute a importância das pausas no trabalho."],"c":1,"x":["Preferir dispensa “mais” e “do que”: “Prefiro o descanso ao excesso de trabalho”.","“Falar de/sobre algo”: a preposição “de” antecede o pronome relativo “que”.","“Haver” no sentido de existir é impessoal: “Houve”.","“Assistir” no sentido de presenciar exige preposição: “ao treinamento”.","“Fazer” indicando tempo é impessoal: “Faz anos”."],"g":0},{"m":"LP","t":"Assinale a alternativa em que a pontuação atende à norma-padrão.","a":["Os pesquisadores, afirmam que as pausas, ajudam a concentração.","As pausas ajudam a concentração, e os erros, segundo os pesquisadores reduzem-se.","As pausas segundo os pesquisadores, ajudam a concentração e, reduzem os erros.","Segundo os pesquisadores as pausas ajudam, a concentração e reduzem os erros.","As pausas, segundo os pesquisadores, ajudam a concentração e reduzem os erros."],"c":4,"x":["Separa sujeito e verbo, e verbo e complemento, com vírgulas indevidas.","A expressão intercalada fica sem a vírgula de fechamento.","A intercalação ficou sem a primeira vírgula e há vírgula entre “e” e o verbo.","Falta a vírgula depois do adjunto inicial e há vírgula indevida entre verbo e objeto.","A expressão intercalada “segundo os pesquisadores” é isolada por vírgulas."],"g":0},{"m":"LP","t":"Conclui-se do texto que a digitalização dos processos","a":["trouxe ganhos de agilidade, mas exige dos tribunais orientação a quem tem pouca familiaridade com a tecnologia.","eliminou as dificuldades de acesso, pois o cidadão consulta tudo em segundos.","beneficia apenas os servidores, que dispensam a orientação ao público.","deve ser evitada, já que sempre cria obstáculos ao acesso à Justiça.","dispensa a preparação das pessoas, pois os sistemas modernos bastam por si."],"c":0,"x":["Resume o 1º e o 2º parágrafos.","O texto fala em “novos desafios”.","O texto trata do cidadão e da necessidade de orientá-lo.","O texto não condena a inovação; diz que ela cumpre sua finalidade quando amplia o acesso.","Contradiz o último parágrafo: “Não basta... instalar sistemas modernos”."],"g":1},{"m":"LP","t":"No trecho “Por isso, cabe aos tribunais oferecer orientação ao público...”, a expressão “Por isso” introduz uma ideia de","a":["condição.","consequência.","concessão.","finalidade.","comparação."],"c":1,"x":["Condição seria “se”, “caso”.","Retoma o que foi dito antes (a mudança trouxe desafios) e apresenta o resultado a que se chega.","Concessão seria introduzida por “embora”, “ainda que”.","Finalidade seria “para que”; “por isso” não a indica.","Não há termos comparados."],"g":1},{"m":"LP","t":"Assinale a alternativa em que a reescrita de trecho do texto atende à norma-padrão de concordância.","a":["Não bastam sistemas modernos; é preciso preparar as pessoas que irão utilizá-los.","Os desafios, sobretudo para quem não tem familiaridade, surgiu com a mudança.","A digitalização dos processos mudaram a rotina dos fóruns.","Fazem anos que os processos foram digitalizados.","Existe telas que permitem consultar o andamento de uma ação."],"c":0,"x":["O verbo “bastar” concorda com “sistemas modernos”; “é preciso” permanece invariável.","O sujeito é plural: “surgiram”.","O sujeito é singular (“A digitalização”): “mudou”.","“Fazer” indicando tempo é impessoal: “Faz anos”.","“Existir” concorda com “telas”: “Existem”."],"g":1},{"m":"LP","t":"Assinale a alternativa em que o sinal indicativo de crase está empregado de acordo com a norma-padrão.","a":["Ficou frente à frente com o juiz.","Referiu-se à aquele servidor com respeito.","O tribunal ofereceu orientação à todos os cidadãos.","Cabe à instituição orientar o público.","A reunião será de segunda à sexta, às 14h."],"c":3,"x":["Expressões de palavras repetidas não têm crase: “frente a frente”.","Com “aquele” a fusão é “àquele”.","Não há crase antes de “todos” (palavra masculina plural).","“Caber” exige “a”, e “a instituição” traz o artigo feminino: a + a = à.","A expressão correta é “de segunda a sexta”."],"g":1},{"m":"LP","t":"Assinale a alternativa que atende à norma-padrão de colocação pronominal.","a":["Lhe informaram que o prazo terminou ontem.","Tudo resolveu-se após a orientação.","O servidor disse que informaria-me o resultado.","Não se preocupem com o prazo.","Me informe o andamento do processo."],"c":3,"x":["Não se inicia oração com pronome oblíquo: “Informaram-lhe”.","O pronome indefinido “tudo” atrai o pronome: “Tudo se resolveu”.","Futuro do pretérito não admite ênclise: “me informaria”.","A palavra negativa “não” atrai o pronome, que fica antes do verbo.","Evita-se iniciar frase com pronome oblíquo: “Informe-me”."],"g":1},{"m":"LP","t":"Do texto, depreende-se que o relógio atrasado da praça representa","a":["o descaso da prefeitura, que se recusa a consertá-lo apesar dos protestos.","um costume local, aceito pelos moradores, que faz parte do modo próprio de a cidade medir o tempo.","um defeito que os moradores gostariam de ver corrigido.","um símbolo de modernidade tecnológica da cidade.","um obstáculo ao turismo, como prova o caso do forasteiro."],"c":1,"x":["A prefeitura quis consertá-lo; os protestos foram contra o conserto.","Os moradores descontam o atraso e protestam contra o conserto: “o tempo da cidade”.","Eles protestaram contra o conserto.","Nada no texto sugere modernidade.","O caso do forasteiro é pontual; o texto não trata de turismo."],"g":2},{"m":"LP","t":"Há emprego de expressão em sentido figurado na seguinte passagem do texto:","a":["Foi um forasteiro quem estranhou...","Quando a prefeitura resolveu consertar o mecanismo...","Os moradores já tinham aprendido a descontar os quinze minutos de atraso...","... perdeu o ônibus por confiar naquelas horas tortas.","O relógio da praça atrasava havia anos..."],"c":3,"x":["Sentido próprio: surpreender-se com algo.","Sentido próprio: reparar o equipamento.","Sentido próprio: subtrair um intervalo de tempo.","“Horas tortas” atribui ao tempo uma característica física que não tem: sentido figurado.","Sentido próprio: o relógio marcava a hora com atraso."],"g":2},{"m":"LP","t":"Em “Consertado, o relógio marcaria o tempo certo”, a forma verbal “marcaria” expressa","a":["ação simultânea ao momento da fala.","fato certo e já concluído no passado.","hipótese que depende de uma condição: o conserto do mecanismo.","hábito frequente dos moradores no presente.","ordem dirigida à prefeitura."],"c":2,"x":["Ação simultânea seria presente.","Isso seria pretérito perfeito.","Futuro do pretérito indica fato possível, condicionado a outro (“Consertado...”).","Hábito presente exigiria presente do indicativo.","Ordem seria imperativo."],"g":2},{"m":"LP","t":"No último período do texto, “os de dentro preferiam a sua”, o pronome “sua” refere-se aos","a":["ônibus e seus horários.","moradores da cidade (“os de dentro”), possuidores da hora a que se faz alusão.","funcionários da prefeitura.","mecanismos do relógio.","forasteiros (“os de fora”)."],"c":1,"x":["O ônibus é citado apenas no episódio do forasteiro.","O possessivo concorda com “hora” (omitida), mas a posse é dos moradores.","Eles aparecem apenas no oitavo período como agentes do conserto.","O possessivo remete a pessoas, não ao mecanismo.","“Os de fora” são os que se serviam da hora exata."],"g":2},{"m":"LP","t":"No trecho “A hora exata, afinal, servia aos de fora”, as vírgulas isolam","a":["elementos de uma enumeração.","vocativo.","aposto explicativo.","expressão de caráter adverbial intercalada na oração.","oração subordinada adjetiva explicativa."],"c":3,"x":["Não há série de elementos de mesma função.","Não há chamamento.","Não há termo que explique o anterior.","“Afinal” é adjunto adverbial intercalado, isolado por vírgulas.","Não há verbo nem pronome relativo."],"g":2},{"m":"LP","t":"Assinale a alternativa em que a regência verbal está de acordo com a norma-padrão.","a":["O servidor obedeceu à ordem do juiz.","Esqueceram das senhas de acesso.","Assisti o julgamento ontem.","O réu namora com a vizinha.","Prefiro cumprir prazos do que atrasá-los."],"c":0,"x":["“Obedecer” é transitivo indireto: obedecer a algo ou alguém.","Ou “esqueceram as senhas” ou “esqueceram-se das senhas”.","No sentido de presenciar: “assisti ao julgamento”.","“Namorar” é transitivo direto: “namora a vizinha”.","Preferir: “prefiro cumprir prazos a atrasá-los”."]},{"m":"DP","t":"Sérgio, oficial de justiça, recebeu de uma das partes certa quantia em dinheiro para custear diligência determinada pelo juiz e, em vez de aplicá-la na finalidade, gastou-a em proveito próprio. Em tese, Sérgio praticou o crime de","a":["corrupção passiva.","peculato.","estelionato.","concussão.","prevaricação."],"c":1,"x":["Exige solicitar, receber ou aceitar vantagem indevida em razão da função (art. 317); não houve vantagem para ato funcional.","Funcionário que, tendo a posse de dinheiro particular em razão do cargo, dele se apropria comete peculato-apropriação.","Exige fraude para obter vantagem; o funcionário que se apropria de valor que detém em razão do cargo responde por crime funcional.","Na concussão o funcionário exige vantagem indevida (art. 316); aqui ele se apropriou de valor já sob sua posse.","Retardar ou omitir ato de ofício por interesse ou sentimento pessoal (art. 319)."],"f":"CP, art. 312"},{"m":"DP","t":"A respeito do crime de corrupção passiva (art. 317 do Código Penal), é correto afirmar que","a":["não alcança quem exerce cargo em comissão, por não ser funcionário público efetivo.","exige que a vantagem seja recebida no exercício da função, não se configurando se solicitada antes de assumi-la.","consuma-se com a mera solicitação da vantagem indevida pelo funcionário público, em razão da função, ainda que não a receba.","é crime próprio de particular, que oferece vantagem a funcionário.","só se configura se o funcionário efetivamente praticar o ato de ofício prometido."],"c":2,"x":["Considera-se funcionário público quem exerce cargo, emprego ou função pública, ainda que transitoriamente ou sem remuneração (art. 327).","O tipo alcança a conduta “ainda que fora da função ou antes de assumi-la, mas em razão dela”.","É crime formal: solicitar, receber ou aceitar promessa já consuma o delito.","Oferecer ou prometer vantagem é corrupção ativa (art. 333).","A prática, o retardo ou a omissão do ato é causa de aumento de pena (§ 1º), não requisito da consumação."],"f":"CP, arts. 317 e 327"},{"m":"DP","t":"Para que se configure o crime de prevaricação (art. 319 do Código Penal), é indispensável que o agente atue","a":["com a finalidade de satisfazer interesse ou sentimento pessoal.","com emprego de violência ou grave ameaça contra o administrado.","na qualidade de particular, no exercício de atividade privada.","causando prejuízo patrimonial à Administração Pública.","mediante recebimento de vantagem indevida."],"c":0,"x":["É o elemento subjetivo específico do tipo.","Violência não integra o tipo.","É crime próprio de funcionário público.","O tipo não exige prejuízo patrimonial.","Com vantagem, a conduta se aproxima da corrupção passiva (art. 317)."],"f":"CP, art. 319"},{"m":"DP","t":"Sobre o crime de desacato (art. 331 do Código Penal), é correto afirmar que","a":["é crime próprio de funcionário público contra particular.","admite modalidade culposa.","exige que o ofendido seja magistrado ou membro do Ministério Público.","só se configura se a ofensa ocorrer durante o exercício da função, e não em razão dela.","pode ser praticado por qualquer pessoa contra funcionário público no exercício da função ou em razão dela."],"c":4,"x":["O ofendido é o funcionário, não o particular.","Só é punido a título de dolo.","Qualquer funcionário público pode ser sujeito passivo.","O tipo abrange as duas hipóteses.","O sujeito ativo é comum; o passivo é o funcionário público."],"f":"CP, art. 331"},{"m":"DPP","t":"De acordo com o Código de Processo Penal, constitui hipótese de impedimento do juiz o fato de","a":["ter aconselhado qualquer das partes.","ser amigo íntimo ou inimigo capital de qualquer das partes.","ser credor ou devedor, tutor ou curador, de qualquer das partes.","ele ter funcionado como juiz de outra instância, pronunciando-se, de fato ou de direito, sobre a questão.","ser sócio ou administrador de sociedade interessada no processo."],"c":3,"x":["Suspeição (art. 254, IV).","Suspeição (art. 254, I).","Suspeição (art. 254, V).","Art. 252, III.","Suspeição (art. 254, VI)."],"f":"CPP, arts. 252 e 254"},{"m":"DPP","t":"Pedro responde a processo por crime cuja pena máxima cominada é de 3 anos de detenção, não se tratando de infração de menor potencial ofensivo. De acordo com o Código de Processo Penal, o procedimento comum aplicável é o","a":["ordinário.","livre, escolhido pelo juiz conforme a complexidade.","sumário.","especial do Tribunal do Júri.","sumaríssimo."],"c":2,"x":["Exige sanção máxima igual ou superior a 4 anos.","O rito decorre da lei, não de escolha do juiz.","Art. 394, § 1º, II: sumário, quando a sanção máxima cominada for inferior a 4 anos.","Aplica-se aos crimes dolosos contra a vida, o que não é o caso.","Reservado às infrações de menor potencial ofensivo (pena máxima não superior a 2 anos)."],"f":"CPP, art. 394"},{"m":"DPP","t":"Citado o acusado, não apresentada a resposta à acusação no prazo legal, o juiz","a":["absolverá sumariamente o acusado.","decretará a prisão preventiva do acusado.","decretará a revelia e prosseguirá o processo sem defesa técnica.","suspenderá o processo e o curso do prazo prescricional.","nomeará defensor para oferecê-la, concedendo-lhe vista dos autos por 10 dias."],"c":4,"x":["A absolvição sumária depende das hipóteses do art. 397, não da omissão.","A falta de resposta não autoriza, por si, a prisão preventiva.","A defesa técnica é obrigatória.","A suspensão do art. 366 ocorre na citação por edital sem comparecimento.","Art. 396-A, § 2º."],"f":"CPP, arts. 396 e 396-A"},{"m":"DPP","t":"Sobre a revisão criminal, regulada no Código de Processo Penal, é correto afirmar que","a":["pode agravar a pena imposta, se surgirem novas provas contra o condenado.","deve ser ajuizada no prazo máximo de dois anos do trânsito em julgado.","serve para rever, em favor da acusação, sentença absolutória transitada em julgado.","pode ser requerida em qualquer tempo, antes da extinção da pena ou após.","só pode ser requerida pelo Ministério Público."],"c":3,"x":["Art. 626, parágrafo único: não pode resultar em agravamento da pena.","Não há prazo para ajuizá-la.","Destina-se a desconstituir condenação definitiva em favor do condenado.","Art. 622.","Podem requerê-la o próprio réu, procurador habilitado ou, em caso de morte, cônjuge, ascendente, descendente ou irmão."],"f":"CPP, arts. 621 a 626"},{"m":"DPP","t":"De acordo com a Lei nº 9.099/95, a suspensão condicional do processo (art. 89) é cabível, entre outros requisitos, nos crimes em que a pena mínima cominada for","a":["inferior a quatro anos.","igual ou inferior a dois anos.","inferior a dois anos.","de qualquer quantidade, desde que o crime não seja hediondo.","igual ou inferior a um ano."],"c":4,"x":["Quatro anos é referência para definir o rito, não o art. 89.","Esse limite define a infração de menor potencial ofensivo, não o art. 89.","O texto legal fixa “igual ou inferior a um ano”.","A lei fixa teto para a pena mínima.","Texto do art. 89, caput."],"f":"Lei 9.099/95, art. 89"},{"m":"DPC","t":"A juíza Helena foi designada para a 3ª Vara Cível da comarca. Em ação ali em curso desde antes de sua chegada, atua como advogado de uma das partes o seu marido. Nesse caso, com base no Código de Processo Civil, a magistrada","a":["está impedida de exercer suas funções no processo.","é suspeita, pois a causa é de parcialidade, que depende de prova.","está impedida apenas se o processo tramitar em segredo de justiça.","pode atuar, desde que as partes concordem expressamente.","pode atuar normalmente, pois o impedimento só ocorre quando o cônjuge for parte."],"c":0,"x":["Art. 144, III e § 1º: impedimento quando o advogado, cônjuge do juiz, já integrava o processo antes do início da atividade judicante.","Trata-se de impedimento (hipótese objetiva); a suspeição (art. 145) refere-se a amizade, inimizade e outras.","O segredo de justiça não é critério de impedimento.","O impedimento não se afasta por consentimento; a decisão é rescindível (art. 966, II).","O impedimento alcança o cônjuge que postula como advogado."],"f":"CPC, arts. 144 e 145"},{"m":"DPC","t":"Beatriz propôs ação perante o Juizado Especial Cível, atribuindo à causa o valor de 30 salários mínimos. Nos termos da Lei nº 9.099/95, a assistência por advogado é","a":["vedada, pois os Juizados são pautados pela informalidade.","dispensada para pessoas jurídicas e obrigatória para pessoas físicas.","facultativa, porque a causa não excede 40 salários mínimos.","obrigatória apenas para o réu.","obrigatória, pois o valor da causa excede 20 salários mínimos."],"c":4,"x":["Informalidade não veda a atuação do advogado.","O critério é o valor da causa, não a natureza da parte.","40 é o limite de competência (art. 3º, I); a dispensa de advogado vai só até 20.","A regra vale para as partes em geral.","Art. 9º: até 20 salários, facultativa; acima disso, obrigatória. A competência (até 40) comporta a causa."],"f":"Lei 9.099/95, arts. 3º e 9º"},{"m":"DPC","t":"A respeito da tutela provisória no Código de Processo Civil, é correto afirmar que a tutela da evidência","a":["só pode ser concedida em caráter antecedente.","pode ser concedida, independentemente de perigo de dano, quando ficar caracterizado o abuso do direito de defesa ou o manifesto propósito protelatório da parte.","depende da demonstração de perigo de dano ou de risco ao resultado útil do processo.","exige prestação de caução em todos os casos.","nunca pode ser concedida liminarmente."],"c":1,"x":["A evidência é requerida no curso do processo; a modalidade antecedente refere-se à urgência.","Art. 311, I.","Esse é requisito da tutela de urgência (art. 300).","A caução é prevista para a tutela de urgência (art. 300, § 1º).","O juiz pode decidir liminarmente nas hipóteses do art. 311, II e III."],"f":"CPC, arts. 300 e 311"},{"m":"DPC","t":"No cumprimento definitivo de sentença que condena ao pagamento de quantia certa, o executado, intimado, não efetua o pagamento voluntário no prazo de 15 dias. Nos termos do CPC, o débito será acrescido de","a":["multa de 5% e de honorários advocatícios de 5%.","honorários de 10%, apenas, sem multa.","multa de 20%, em razão da inadimplência.","multa de 10% e de honorários advocatícios de 10%.","multa de 10%, apenas, sem honorários."],"c":3,"x":["Percentuais incorretos.","A multa de 10% também incide.","Não há essa previsão.","Art. 523, § 1º.","O § 1º prevê multa e honorários."],"f":"CPC, art. 523"},{"m":"DPC","t":"Segundo a Lei nº 12.153/2009, dentre as ações a seguir, é de competência do Juizado Especial da Fazenda Pública a","a":["execução fiscal proposta pelo Estado.","ação de desapropriação movida pelo Município.","ação de indenização de 70 salários mínimos contra o Município.","ação popular proposta contra ato do Município.","ação de cobrança, de valor equivalente a 50 salários mínimos, proposta contra um Município."],"c":4,"x":["Excluída (art. 2º, § 1º, I).","Excluída (art. 2º, § 1º, I).","Excede o limite de 60 salários mínimos.","Excluída (art. 2º, § 1º, I).","Art. 2º: causas cíveis de interesse dos entes federados até 60 salários mínimos."],"f":"Lei 12.153/2009, art. 2º"},{"m":"DC","t":"Segundo a Constituição Federal, a casa é asilo inviolável do indivíduo. Na ausência de consentimento do morador, é situação constitucionalmente admitida o ingresso","a":["de oficial de justiça, às 22h, para cumprir mandado de busca e apreensão expedido por juiz.","de policiais, a qualquer hora do dia ou da noite, para fazer cessar flagrante delito em curso no interior da residência.","de policiais, durante o dia, com ordem verbal do delegado de polícia.","de autoridade administrativa, durante o dia, para fiscalização, sem ordem judicial e sem flagrante.","de policiais, à noite, para cumprir mandado judicial de prisão."],"c":1,"x":["A determinação judicial só autoriza o ingresso durante o dia.","Art. 5º, XI: flagrante delito, desastre ou socorro permitem o ingresso a qualquer hora.","A ordem policial não supre a determinação judicial.","Sem consentimento, só nas hipóteses constitucionais.","À noite, a ordem judicial não autoriza o ingresso na casa."],"f":"CF, art. 5º, XI"},{"m":"DC","t":"De acordo com a Constituição Federal, pode adquirir a nacionalidade brasileira por naturalização","a":["o estrangeiro de qualquer nacionalidade, residente no Brasil há mais de quinze anos ininterruptos e sem condenação penal, desde que a requeira.","o filho de pai brasileiro, nascido no exterior, registrado em repartição brasileira competente.","o estrangeiro residente há cinco anos, independentemente de antecedentes penais.","o estrangeiro de qualquer nacionalidade, residente há mais de dez anos ininterruptos e sem condenação penal.","o nascido no Brasil, filho de estrangeiros que não estejam a serviço de seu país."],"c":0,"x":["Art. 12, II, b.","É brasileiro nato (art. 12, I, c).","Faltam o prazo e a ausência de condenação penal.","O prazo constitucional é de mais de quinze anos.","É brasileiro nato (art. 12, I, a)."],"f":"CF, art. 12"},{"m":"DC","t":"Nos termos da Constituição Federal, o prazo de validade do concurso público será de até","a":["dois anos, prorrogável sucessivamente, sem limite.","um ano, prorrogável por mais dois anos.","dois anos, prorrogável uma vez, por igual período.","três anos, prorrogável uma vez por um ano.","quatro anos, improrrogável."],"c":2,"x":["Admite apenas uma prorrogação.","O prazo é de até dois anos, com uma prorrogação por igual período.","Art. 37, III.","Prazo e prorrogação divergentes do texto.","Não é o prazo constitucional."],"f":"CF, art. 37, III"},{"m":"DC","t":"Um motorista de ambulância de hospital municipal, no exercício de suas funções, conduz o veículo com culpa e causa dano a terceiro. Segundo a Constituição Federal, o Município","a":["não responde, pois somente o motorista pode ser acionado.","só responde se comprovado o dolo do motorista.","responde apenas de forma subsidiária, após esgotado o patrimônio do motorista.","responde, mas não tem direito de regresso contra o motorista.","responde pelo dano independentemente de culpa, assegurado o direito de regresso contra o motorista nos casos de dolo ou culpa."],"c":4,"x":["O ente responde pelos danos que seus agentes, nessa qualidade, causarem.","A responsabilidade do ente é objetiva; dolo ou culpa do agente importa ao regresso.","Não há subsidiariedade prevista no texto constitucional.","O regresso é assegurado nos casos de dolo ou culpa.","Art. 37, § 6º: responsabilidade objetiva do Estado."],"f":"CF, art. 37, § 6º"},{"m":"DC","t":"É direito dos trabalhadores urbanos e rurais, previsto na Constituição Federal,","a":["licença à gestante, sem prejuízo do emprego e do salário, com duração de cento e oitenta dias.","duração do trabalho normal não superior a oito horas diárias e quarenta horas semanais.","jornada de oito horas para o trabalho em turnos ininterruptos de revezamento.","remuneração do serviço extraordinário superior, no mínimo, em cinquenta por cento à do normal.","férias anuais remuneradas com, pelo menos, o dobro do salário normal."],"c":3,"x":["A Constituição prevê 120 dias (art. 7º, XVIII); 180 decorre de programa de adesão facultativa.","O limite semanal é de 44 horas (art. 7º, XIII).","Nesses turnos, a jornada é de seis horas, salvo negociação coletiva (art. 7º, XIV).","Art. 7º, XVI.","O adicional é de, pelo menos, um terço (art. 7º, XVII)."],"f":"CF, art. 7º"},{"m":"DA","t":"Um funcionário público estadual foi demitido e, em ação judicial, a demissão foi anulada por decisão transitada em julgado. De acordo com o Estatuto dos Funcionários Públicos Civis do Estado de São Paulo, o retorno desse funcionário ao serviço público ocorrerá por","a":["reintegração, com ressarcimento dos prejuízos resultantes do afastamento.","readmissão, sem direito a ressarcimento dos prejuízos do afastamento.","nova nomeação, a critério da Administração.","aproveitamento, forma de retorno de quem estava em disponibilidade.","reversão, forma de retorno de quem estava aposentado."],"c":0,"x":["Reintegração é o reingresso decorrente de decisão judicial passada em julgado, com ressarcimento de prejuízos.","A readmissão não pressupõe decisão judicial anulatória nem gera ressarcimento.","O retorno por decisão judicial é direito do funcionário, não ato discricionário.","Aplica-se a quem estava em disponibilidade, não ao demitido.","Aplica-se ao aposentado."],"f":"Lei 10.261/68 (reintegração)"},{"m":"DA","t":"No processo administrativo disciplinar previsto no Estatuto dos Funcionários Públicos Civis do Estado de São Paulo, quanto às testemunhas, é correto afirmar que","a":["o presidente e cada acusado poderão arrolar até cinco testemunhas.","a oitiva de servidor público como testemunha ocorre sempre em segredo de justiça.","cada acusado poderá arrolar até dez testemunhas, e o presidente, nenhuma.","as testemunhas de defesa podem ser recusadas livremente pelo presidente, sem limite.","nenhuma testemunha pode recusar-se a depor, mesmo em razão de função, ministério, ofício ou profissão."],"c":0,"x":["Regra do Estatuto para a prova testemunhal.","Não há essa regra no Estatuto.","O limite é de cinco, para o presidente e para cada acusado.","O presidente não pode cercear a defesa arbitrariamente.","Quem deve guardar segredo em razão do ofício pode recusar-se a depor."],"f":"Lei 10.261/68 (processo administrativo)"},{"m":"DA","t":"Julgada procedente a revisão de processo administrativo disciplinar, nos termos do Estatuto dos Funcionários Públicos Civis do Estado de São Paulo, a autoridade poderá","a":["somente anular o processo, vedada qualquer modificação da pena.","alterar a classificação da infração, absolver o punido, modificar a pena ou anular o processo.","agravar a pena, se novas provas indicarem maior gravidade da falta.","restabelecer a pena, devolvendo o prazo recursal.","determinar nova instauração de processo contra o requerente pelos mesmos fatos."],"c":1,"x":["O rol é mais amplo.","Efeitos possíveis da procedência da revisão.","Da revisão não pode resultar agravamento da pena.","Não é efeito previsto.","A revisão favorece o punido."],"f":"Lei 10.261/68 (revisão)"},{"m":"DA","t":"Rubens, servidor público, agindo dolosamente, permitiu que bens da repartição fossem utilizados por terceiro, causando perda patrimonial ao erário (ato de improbidade do art. 10 da Lei nº 8.429/92). Entre as sanções previstas na lei para esse caso, estão","a":["a suspensão dos direitos políticos até 14 anos e a multa civil equivalente ao acréscimo patrimonial.","somente advertência por escrito, pois o dano é reparável.","o ressarcimento integral do dano, a perda da função pública, a suspensão dos direitos políticos até 12 anos e a multa civil equivalente ao valor do dano.","pena de reclusão de dois a oito anos.","apenas multa civil de até 24 vezes o valor da remuneração do agente."],"c":2,"x":["São sanções do art. 9º (enriquecimento ilícito).","A lei prevê sanções próprias; não basta advertência.","Art. 12, II.","As sanções da LIA não são penas privativas de liberdade; a esfera penal é autônoma.","Sanção do art. 11 (violação de princípios)."],"f":"Lei 8.429/92, arts. 10 e 12, II"},{"m":"DA","t":"A respeito dos atos de improbidade administrativa que atentam contra os princípios da administração pública (art. 11 da Lei nº 8.429/92), é correto afirmar que","a":["têm como sanç ["Pelo menos um servidor concluiu o curso.","Nenhum servidor concluiu o curso.","Todos os servidores não concluíram o curso.","Pelo menos um servidor não concluiu o curso.","Alguns servidores concluíram o curso."],"c":3,"x":["Compatível com a proposição original.","É a contrária, não a negação.","Equivale a “nenhum”.","Nega-se “todos” com “pelo menos um... não”.","Compatível com a proposição original."]},{"m":"RL","t":"Na sequência 3, 7, 15, 31, 63, ..., cada termo, a partir do segundo, é obtido do anterior por uma mesma regra. O 8º termo da sequência é","a":["255.","383.","511.","512.","1023."],"c":2,"x":["É o 7º termo.","Não decorre da regra.","Cada termo é o dobro do anterior mais 1: 63, 127, 255, 511.","Seria potência de 2, que não segue a regra.","É o 9º termo."]},{"m":"RL","t":"Uma proposição equivalente a “Se o processo é digital, então a consulta é remota” é","a":["O processo não é digital ou a consulta não é remota.","Se a consulta é remota, então o processo é digital.","O processo é digital e a consulta não é remota.","Se o processo não é digital, então a consulta não é remota.","Se a consulta não é remota, então o processo não é digital."],"c":4,"x":["Não equivale à condicional (~p ou q).","É a recíproca, não equivalente.","É a negação da condicional.","É a inversa, não equivalente.","É a contrapositiva: ~q → ~p."]},{"m":"RL","t":"Considere verdadeiras as afirmações: “Nenhum técnico é estagiário” e “Todo escrevente é técnico”. Conclui-se que","a":["todo técnico é escrevente.","algum escrevente é estagiário.","todo estagiário é escrevente.","nenhum escrevente é estagiário.","algum estagiário é técnico."],"c":3,"x":["Não decorre; podem existir técnicos que não sejam escreventes.","Contradiz a conclusão válida.","Não decorre das premissas.","Se todo escrevente é técnico e nenhum técnico é estagiário, nenhum escrevente é estagiário.","Contradiz a primeira premissa."]},{"m":"RL","t":"Marta, Nilo e Olga atuam em setores diferentes: cartório, protocolo e atendim const TX={1:["Há quem trate o tempo livre como um luxo reservado aos que já cumpriram todas as obrigações. Nesse raciocínio, descansar é uma recompensa que só se conquista depois de muito esforço, e quem faz uma pausa antes da hora é logo visto com desconfiança. Contudo, estudos sobre produtividade mostram que as pausas regulares aumentam a concentração e reduzem os erros, de modo que o descanso funciona menos como prêmio do que como parte do próprio trabalho.\nNão se trata de defender a preguiça. Trata-se de reconhecer que a mente, assim como o corpo, rende melhor quando se respeita o seu ritmo. Ignorar esse limite pode parecer sinal de dedicação, mas costuma resultar em cansaço, em atrasos e, a longo prazo, em desistência.", "A digitalização dos processos mudou a rotina dos fóruns. Onde antes havia prateleiras de autos, hoje há telas que permitem consultar, em segundos, o andamento de uma ação. A mudança trouxe agilidade, mas também novos desafios, sobretudo para quem não tem familiaridade com a tecnologia.\nPor isso, cabe aos tribunais oferecer orientação ao público, de modo que o cidadão, ainda que não domine as ferramentas digitais, consiga exercer os seus direitos. A inovação só cumpre sua finalidade quando amplia o acesso à Justiça, em vez de criar obstáculos a ele.\nNão basta, portanto, instalar sistemas modernos; é preciso preparar as pessoas que irão utilizá-los, dentro e fora das instituições.", "O relógio da praça atrasava havia anos, e ninguém na cidade parecia incomodado com isso. Os moradores já tinham aprendido a descontar os quinze minutos de atraso, como quem corrige, sem pensar, um hábito antigo do vizinho. Foi um forasteiro quem estranhou: perdeu o ônibus por confiar naquelas horas tortas.\nQuando a prefeitura resolveu consertar o mecanismo, houve quem protestasse. Consertado, o relógio marcaria o tempo certo, mas já não marcaria o tempo da cidade. A hora exata, afinal, servia aos de fora; os de dentro preferiam a sua."]};

const N=45;let S;try{S=JSON.parse(localStorage.getItem('sentenca'))}catch(e){}
S=S||{cfg:{start:'2027-01-11',end:'2027-03-12'},runs:{},rev:{c:0,e:0,m:{}},fc:{c:0,e:0,m:{}},ex:{}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),save=()=>{try{localStorage.setItem('sentenca',JSON.stringify(S))}catch(e){}};
const tx=(s,x)=>{const a=(S.tx&&S.tx[s])||TX[s]||[];return x.g!=null&&a[x.g]?`<div class=tx>${esc(a[x.g]).replace(/\n/g,'<br><br>')}</div>`:''},qs=i=>S.ex[i]||BANK[i]||[],fmt=s=>new Date(s+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}),bar=(a,b)=>`<div class=bar><i style="width:${b?a/b*100:0}%"></i></div>`;
function days(){const r=[],d=new Date(S.cfg.start+'T12:00'),e=new Date(S.cfg.end+'T12:00');while(d<=e&&r.length<N){if(d.getDay()%6)r.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return r}
function res(i,a){const q=qs(i),by={};let ok=0;q.forEach((x,k)=>{const b=by[x.m]=by[x.m]||[0,0];b[1]++;if(a[k]===x.c){ok++;b[0]++}});const t=q.length,need=Math.ceil(t*.9),b1=[0,0],b2=[0,0];for(const m in by){const g=BL[m]==1?b1:BL[m]==2?b2:null;if(g){g[0]+=by[m][0];g[1]+=by[m][1]}}return{ok,t,by,nota:t?ok/t*10:0,falta:Math.max(0,need-ok),pct:t?ok/t*100:0,b1,b2}}
function logo(p){const y=129*(1-p/100);return `<svg viewBox="0 0 241 129" class=logo role=img aria-label="Brasão do TJSP"><defs><filter id=gs><feColorMatrix type=saturate values=0 /></filter><g id=br>${BR}</g><clipPath id=cp><rect x=0 y=${y} width=241 height=129 /></clipPath></defs><use href="#br" filter="url(#gs)" opacity=.2 /><g clip-path="url(#cp)"><use href="#br" /></g></svg>`}
let V={t:'home'},T=null,RQ={},FQ={},RS=0;
const go=(t,x={})=>{RS=0;V={t,...x};render();scrollTo(0,0)};
function render(){const f={home,sims,take,gab,gabd,rev,revq,fc,est,cfg}[V.t];$('#v').innerHTML=f();const a=({take:'sims',gabd:'gab',revq:'rev',fc:'rev'})[V.t]||V.t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===a))}
function allRuns(){return Object.keys(S.runs).sort((a,b)=>S.runs[a].d-S.runs[b].d).map(i=>({i,...res(i,S.runs[i].a),r:S.runs[i]}))}
function evo(R){const n=R.length,w=300,h=100,P=R.map((r,k)=>`${n>1?k*w/(n-1):w/2},${h-r.pct*h/100}`).join(' '),wk={};R.forEach(r=>{const d=new Date(r.r.d);d.setDate(d.getDate()-(d.getDay()+6)%7);const k=d.toISOString().slice(0,10);(wk[k]=wk[k]||[]).push(r.pct)});
return `<svg viewBox="-4 -4 ${w+8} ${h+8}" class=ch><line x1=0 x2=${w} y1=${h*.1} y2=${h*.1} stroke="#1f8a5b" stroke-dasharray=4 /><polyline points="${P}" fill=none stroke="#1b2a49" stroke-width=2 /></svg><small class=m>Linha tracejada = meta (90%)</small><h3>Média por semana</h3><table>${Object.keys(wk).sort().map(k=>`<tr><td>Semana de ${fmt(k).split(', ')[1]}</td><td>${(wk[k].reduce((a,b)=>a+b)/wk[k].length).toFixed(1)}%</td><td>${wk[k].length} simulado(s)</td></tr>`).join('')}</table>`}
function home(){const d=Object.keys(S.runs).length,dd=days();let k=1;while(S.runs[k]&&k<=N)k++;
let h=`<div class=hero>${logo(d/N*100)}<h1>Sentença</h1><p class=m>Simulados Escrevente TJSP · prova em 14/03/2027</p><div class=big>${Math.round(d/N*100)}%</div><p class=m>${d} de ${N} simulados concluídos</p></div>`;
if(d>=N){const R=allRuns(),tq=R.reduce((a,r)=>a+r.t,0),f=R.slice(0,5),l=R.slice(-5),av=a=>a.reduce((s,r)=>s+r.pct,0)/a.length;h+=`<div class=card><h2>Meta cumprida</h2><p>Você fez ${tq} questões. Média dos 5 primeiros: ${av(f).toFixed(1)}% · dos 5 últimos: ${av(l).toFixed(1)}% (${(av(l)-av(f)>=0?'+':'')+(av(l)-av(f)).toFixed(1)} pontos).</p>${evo(R)}</div>`}
else h+=`<div class=card><b>Próximo: Simulado ${k}</b><p class=m>${dd[k-1]?fmt(dd[k-1]):'sem data no cronograma'} · ${qs(k).length}/70 questões</p>${qs(k).length?`<button class=pri onclick="go('take',{sim:${k}})">Começar</button>`:'<small class=m>Em preparação: importe as questões em Ajustes.</small>'}</div>`;return h}
function sims(){const dd=days(),td=new Date().toISOString().slice(0,10);let h='<h2>Cronograma</h2><p class=m>Dias úteis; fazer antes (inclusive no fim de semana) conta normalmente.</p>';for(let i=1;i<=N;i++){const r=S.runs[i],n=qs(i).length,dt=dd[i-1],st=r?'<span class=ok>feito</span>':!dt?'':dt<td?'<span class=bad>atrasado</span>':dt==td?'<b>hoje</b>':'';h+=`<div class=row><div><b>Simulado ${i}</b><br><small class=m>${dt?fmt(dt):'sem data'} · ${n}/70 questões</small></div><div>${st} ${r?'':n?`<button onclick="go('take',{sim:${i}})">Fazer</button>`:'<small class=m>em preparação</small>'}</div></div>`}return h}
function take(){const q=qs(V.sim);if(!T||T.sim!=V.sim)T={sim:V.sim,i:0,a:[]};if(T.fin)return fin();const x=q[T.i];
return `<h2>Simulado ${T.sim} · ${T.i+1}/${q.length}</h2><div class=m>${M[x.m]}</div>${tx(T.sim,x)}<p class=q>${esc(x.t)}</p>${x.a.map((o,k)=>`<button class="alt ${T.a[T.i]===k?'sel':''}" onclick="T.a[T.i]=${k};render()">${'ABCDE'[k]}) ${esc(o)}</button>`).join('')}<div class=grid>${q.map((_,k)=>`<button class="${T.a[k]!=null?'dn':''} ${k==T.i?'cur':''}" onclick="T.i=${k};render()">${k+1}</button>`).join('')}</div><div class=nav><button onclick="mv(-1)">Anterior</button><button onclick="mv(1)">Próxima</button><button class=pri onclick="fim()">Finalizar</button></div>`}
const mv=d=>{T.i=Math.max(0,Math.min(qs(T.sim).length-1,T.i+d));render()};
function fim(){const q=qs(T.sim),u=q.filter((_,k)=>T.a[k]==null).length;if(u&&!confirm(u+' questão(ões) sem resposta. Finalizar?'))return;T.fin=1;render()}
function fin(){const o=n=>`<select id=${n}>${[1,2,3,4,5].map(v=>`<option>${v}</option>`).join('')}</select>`;return `<h2>Simulado ${T.sim} concluído</h2><div class=card><p>Cansaço ao final (1 = descansado, 5 = exausto)</p>${o('fa')}<p>Dificuldade da prova (1 = fácil, 5 = muito difícil)</p>${o('di')}<br><br><button class=pri onclick="done()">Salvar e abrir gabarito</button></div>`}
function done(){const s=T.sim;S.runs[s]={a:qs(s).map((_,k)=>T.a[k]??null),d:Date.now(),fa:+$('#fa').value,di:+$('#di').value};save();T=null;go('gabd',{sim:s})}
function gab(){const d=Object.keys(S.runs);return '<h2>Gabaritos</h2><p class=m>As respostas só aparecem ao abrir o gabarito do simulado.</p>'+(d.length?d.map(i=>`<div class=row><div><b>Simulado ${i}</b><br><small class=m>feito em ${new Date(S.runs[i].d).toLocaleDateString('pt-BR')}</small></div><button onclick="go('gabd',{sim:${i}})">Abrir gabarito</button></div>`).join(''):'<p class=m>Conclua um simulado para liberar o gabarito.</p>')}
function gabd(){const i=V.sim,r=S.runs[i],R=res(i,r.a);let h=`<h2>Gabarito · Simulado ${i}</h2><div class=card><div class=big>${R.nota.toFixed(2)}</div><p>${R.ok}/${R.t} acertos (${R.pct.toFixed(0)}%) · ${R.falta?`faltam ${R.falta} questões para a nota 9`:'meta da nota 9 atingida'}</p><small class=m>Bloco I: ${R.b1[0]}/${R.b1[1]} · Bloco II: ${R.b2[0]}/${R.b2[1]} (mínimo de 50% em cada bloco)</small></div>`;
qs(i).forEach((x,k)=>{const m=r.a[k];h+=`<div class=card><div class=m>${k+1} · ${M[x.m]} · ${m==null?'em branco':m==x.c?'<span class=ok>acertou</span>':'<span class=bad>errou</span>'}</div>${tx(i,x)}<p class=q>${esc(x.t)}</p>${x.a.map((o,j)=>`<div class="ex ${j==x.c?'g':''} ${j==m&&j!=x.c?'r':''}"><b>${'ABCDE'[j]}) ${esc(o)}</b>${j==m?' ← sua resposta':''}<br><small>${j==x.c?'Certa: ':'Errada: '}${esc(x.x[j])}</small></div>`).join('')}${x.f?`<small class=m>Base: ${esc(x.f)}</small>`:''}</div>`});return h}
const pool=()=>Object.keys(S.runs).flatMap(s=>qs(s).map((x,i)=>({k:s+'-'+i,x})));
function rev(){const d=Object.keys(S.runs);return '<h2>Revisão</h2>'+(d.length?`<button class=pri onclick="go('fc',{i:0})">Flashcards (${pool().length} questões)</button><h3>Refazer simulado</h3>`+d.map(i=>`<div class=row><b>Simulado ${i}</b><button onclick="go('revq',{sim:${i},i:0})">Revisar</button></div>`).join(''):'<p class=m>Conclua um simulado para liberar a revisão.</p>')}
function qcard(x,sel,kind,key,i,n){const a=sel!=null,ok=a&&sel==x.c;return `<div class="card ${a?ok?'gc':'rc':''}"><div class=m>${i+1}/${n} · ${M[x.m]}</div>${tx(key.split('-')[0],x)}<p class=q>${esc(x.t)}</p>${x.a.map((o,j)=>`<button class="alt ${a&&j==x.c?'g':''} ${a&&j==sel&&j!=x.c?'r':''}" ${a?'disabled':''} onclick="ans('${kind}','${key}',${j})">${'ABCDE'[j]}) ${esc(o)}</button>${a?`<small class=ex>${j==x.c?'Certa: ':'Errada: '}${esc(x.x[j])}</small>`:''}`).join('')}${a&&x.f?`<small class=m>Base: ${esc(x.f)}</small>`:''}</div><div class=nav><button onclick="step(${i-1})">Anterior</button><button onclick="step(${i+1})">Próxima</button><button onclick="go('rev')">Sair</button></div>`}
function revq(){const q=qs(V.sim),k=V.sim+'-'+V.i;return qcard(q[V.i],RQ[k],'rv',k,V.i,q.length)}
function fc(){const p=pool();if(!p.length)return '<h2>Flashcards</h2><p class=m>Sem questões concluídas.</p>';V.i=V.i||0;const c=p[V.i];return '<h2>Flashcards</h2>'+qcard(c.x,FQ[c.k],'fc',c.k,V.i,p.length)}
function step(i){const n=V.t=='fc'?pool().length:qs(V.sim).length;V.i=Math.max(0,Math.min(n-1,i));render();scrollTo(0,0)}
function ans(kind,key,j){const[s,i]=key.split('-'),x=qs(s)[i],o=kind=='rv'?S.rev:S.fc,ok=j==x.c;(kind=='rv'?RQ:FQ)[key]=j;ok?o.c++:o.e++;(o.m[x.m]=o.m[x.m]||[0,0])[ok?0:1]++;save();render()}
function tb(o){const t=o.c+o.e;return t?`<p>${o.c}/${t} acertos (${(o.c/t*100).toFixed(0)}%)</p><table>${Object.keys(o.m).map(m=>`<tr><td>${M[m]}</td><td>${o.m[m][0]}/${o.m[m][0]+o.m[m][1]}</td></tr>`).join('')}</table>`:'<p class=m>Sem dados.</p>'}
function est(){const R=allRuns();if(!R.length)return '<h2>Estatísticas</h2><p class=m>Faça um simulado para gerar estatísticas.</p>';let A=0,B=0;const tot={};R.forEach(r=>{A+=r.ok;B+=r.t;for(const m in r.by){const b=tot[m]=tot[m]||[0,0];b[0]+=r.by[m][0];b[1]+=r.by[m][1]}});const av=k=>(R.reduce((s,r)=>s+r.r[k],0)/R.length).toFixed(1);
return `<h2>Estatísticas</h2><div class=card><h3>Simulados</h3><p>Média geral: ${(A/B*100).toFixed(1)}% (${A}/${B}) · nota média ${(A/B*10).toFixed(2)} · ${R.length} simulado(s)</p><p class=m>Cansaço médio ${av('fa')}/5 · dificuldade média ${av('di')}/5</p><h3>Por matéria</h3><table>${Object.keys(tot).map(m=>`<tr><td>${M[m]}</td><td>${tot[m][0]}/${tot[m][1]}</td><td>${(tot[m][0]/tot[m][1]*100).toFixed(0)}%</td></tr>`).join('')}</table><h3>Por prova</h3><table><tr><th>Sim.</th><th>Acertos</th><th>%</th><th>Nota</th><th>Faltam p/ 9</th></tr>${R.map(r=>`<tr><td>${r.i}</td><td>${r.ok}/${r.t}</td><td>${r.pct.toFixed(0)}%</td><td>${r.nota.toFixed(2)}</td><td>${r.falta}</td></tr>`).join('')}</table><h3>Evolução</h3>${evo(R)}</div><div class=card><h3>Revisão</h3>${tb(S.rev)}</div><div class=card><h3>Flashcards</h3>${tb(S.fc)}</div>`}
function cfg(){return `<h2>Ajustes</h2><div class=card><b>Cronograma</b><p><label>Início <input type=date value=${S.cfg.start} onchange="S.cfg.start=this.value;save()"></label> <label>Fim <input type=date value=${S.cfg.end} onchange="S.cfg.end=this.value;save()"></label></p><p class=m>Os ${N} simulados ocupam os dias úteis a partir do início.</p></div><div class=card><b>Backup</b> <small class=m>(dados ficam neste navegador)</small><p><button onclick="exp()">Exportar</button> <label class=btn>Importar<input type=file hidden accept=.json onchange="imp(this,'d')"></label></p></div><div class=card><b>Banco de questões</b><p class=m>Importe lotes em JSON: {"sim":2,"tx":["texto de apoio (opcional)"],"q":[{"m":"LP","g":0,"f":"fonte (opcional)","t":"…","a":["…","…","…","…","…"],"c":0,"x":["…","…","…","…","…"]}]}. Matérias: ${Object.keys(M).join(', ')}.</p><label class=btn>Importar questões<input type=file hidden accept=.json onchange="imp(this,'q')"></label></div><div class="card dz"><b class=bad>Zona de risco</b><p class=m>Reiniciar apaga todo o seu progresso e não pode ser desfeito.</p>${RS?`<p><b>Atenção:</b> serão apagados ${Object.keys(S.runs).length} simulado(s) feito(s), com respostas, gabaritos, notas, estatísticas, revisão e flashcards. Você terá de refazer os simulados desde o início. Suas datas e as questões importadas são mantidas.</p><p><button onclick="exp()">Exportar backup antes</button></p><p class=m>Para confirmar, digite REINICIAR (em maiúsculas):</p><input id=rt autocomplete=off oninput="$('#rb').disabled=this.value!=='REINICIAR'"><br><br><button id=rb class=dng disabled onclick="rsGo()">Apagar tudo e reiniciar</button> <button onclick="RS=0;render()">Cancelar</button>`:'<button onclick="RS=1;render()">Reiniciar cronograma</button>'}</div>`}
function rsGo(){if($('#rt').value!=='REINICIAR')return;S.runs={};S.rev={c:0,e:0,m:{}};S.fc={c:0,e:0,m:{}};T=null;RQ={};FQ={};RS=0;save();alert('Cronograma reiniciado.');go('home')}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='sentenca-backup.json';a.click()}
function imp(el,k){el.files[0].text().then(t=>{const j=JSON.parse(t);if(k=='d')S=j;else(Array.isArray(j)?j:[j]).forEach(b=>{if(b.sim>=1&&b.sim<=N&&Array.isArray(b.q)){S.ex[b.sim]=b.q;S.tx=S.tx||{};if(b.tx)S.tx[b.sim]=b.tx;else delete S.tx[b.sim]}});save();render();alert('Importado.')}).catch(()=>alert('Arquivo inválido.'))}
try{const u=location.href.split('#')[0],m={name:'Sentença · Simulados Escrevente TJSP',short_name:'Sentença',start_url:u,scope:u.replace(/[^/]*$/,''),display:'standalone',background_color:'#ffffff',theme_color:'#1b2a49',lang:'pt-BR',icons:[{src:IC.a,sizes:'192x192',type:'image/png'},{src:IC.b,sizes:'512x512',type:'image/png'}]};
const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
const a=document.createElement('link');a.rel='apple-touch-icon';a.href=IC.a;document.head.appendChild(a)}catch(e){}
render();
</script></body></html>
